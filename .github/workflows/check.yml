name: check

# The verifier's own tests, which replay `vectors/arithmetic.json` and
# hold the checker to `SPEC.md`, each under five seconds: the public copy of the
# gate's tests. They need Node and nothing else: there is no build here, no
# dependency, and no install step. No lab is played here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - run: node --test --test-timeout=5000 verifier/test/*.test.js vectors/test/*.test.js
