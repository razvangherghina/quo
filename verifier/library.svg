<svg xmlns="http://www.w3.org/2000/svg" width="100%" style="height:auto" viewBox="0 0 1200 770" role="img" aria-label="The verifier">
<title>The verifier</title>
<desc>The verifier lays a hollow wall over a kit and talks to its stand program by one JSON line a request and one an answer. It runs 20 scenarios: wards and invitations, the move, the count, at one moment, the reaches, the zero head, the signature, strangers, the payload, unannounced, removal, the size, the asker, the listener, the dialer, the post listener, the post dialer, the held line listener, the held line dialer, the invitation's at.</desc>
<rect width="1200" height="770" style="fill:#f6f2ea"/>
<text x="40" y="62" text-anchor="start" font-size="34" font-weight="400" font-family="'Instrument Serif', ui-serif, Georgia, serif" style="fill:#17140f">The verifier</text>
<text x="40" y="90" text-anchor="start" font-size="13" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="fill:#5e574b">verifier: a checker any kit may run. It says where a kit departs from SPEC.md and nothing more.</text>
<line x1="40" y1="108" x2="1160" y2="108" style="stroke:#ddd5c6" stroke-width="1.5"/>
