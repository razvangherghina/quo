" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="fill:#17140f">as a carrier</text><rect x="360" y="486" width="190" height="21" rx="10.5" style="fill:none;stroke:#17140f" stroke-width="1.3"/><text x="455" y="500.5" text-anchor="middle" font-size="11.5" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="fill:#17140f">two kits, by its proxy</text><text x="40" y="530" text-anchor="start" font-size="12" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="fill:#5e574b">tcp, http and ws, each judged only where the kit stands it</text><g transform="translate(70 600)"><g transform="translate(0 0)"><rect x="-30" y="-15" width="60" height="30" fill="url(#hatch)"/></g></g><rect x="40" y="585" width="60" height="30" rx="4" fill="none" style="stroke:#5e574b" stroke-width="1.3"/><text x="116" y="596" text-anchor="start" font-size="12.5" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="fill:#17140f">What stands behind a door is not Quo,</text><text x="116" y="614" text-anchor="start" font-size="12.5" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="fill:#17140f">and the verifier never looks there.</text><text letter-spacing="1.5" x="660" y="140" text-anchor="start" font-size="12" font-weight="600" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="fill:#5e574b">ITS 20 SCENARIOS, IN THE ORDER IT RUNS THEM</text><rect x="660" y="162" width="232" height="21" rx="10.5" style="fill:none;stroke:#17140f" stroke-width="1.3"/><text x="776" y="176.5" text-anchor="middle" font-size="11.5" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" style="fill:#17140f">wards and invitations</text><rect x="660" y="194" width="232" height="21" rx="10.5" style="fill:none;stroke:#171