[package]
name = "quo-kit"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
ed25519-dalek = { version = "2.2", default-features = false }
hkdf = "0.12"
ml-kem = { version = "=0.2.3", default-features = false, features = ["deterministic"] }
sha2 = "0.10"
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "precomputed-tables", "zeroize"] }

[dev-dependencies]
curve25519-dalek = "4.1"
serde_json = "1"
