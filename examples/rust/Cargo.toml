[package]
name = "quokit"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

[lib]
path = "src/lib.rs"

[[bin]]
name = "stand"
path = "src/bin/stand.rs"

[dependencies]
ed25519-dalek = "=2.2.0"
x25519-dalek = "=2.0.1"
ml-kem = { version = "=0.2.3", features = ["deterministic"] }
sha2 = "=0.10.9"
aes-gcm = "=0.10.3"
hkdf = "=0.12.4"
