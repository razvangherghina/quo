[package]
name = "quo-line"
version = "0.0.0"
description = "The Quo line: framed envelopes over one persistent TCP connection, the road named beside the common carriage."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage = "https://quo.systems"
repository = "https://github.com/razvangherghina/quo"
keywords = ["quo", "protocol", "transport", "tcp"]
categories = ["network-programming"]

[dependencies]
quo-carriage = { version = "0.0.0", path = "../carriage" }
quo-notation = { version = "0.0.0", path = "../notation" }
quo-wire = { version = "0.0.0", path = "../wire" }

[dev-dependencies]
quo-arithmetic = { path = "../arithmetic" }
quo-envelope = { path = "../envelope" }
