[project]
name = "quo-systems"
version = "0.3.1"
description = "Quo in Python: the protocol that answers by whose authority."
requires-python = ">=3.11"
dependencies = ["cryptography"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quo"]
